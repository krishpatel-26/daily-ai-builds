[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unifiedlane-ai-company-os"
version = "0.1.0"
description = "Policy-aware orchestration for a multi-agent AI company"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["company_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
