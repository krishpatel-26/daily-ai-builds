[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-workbench"
version = "0.1.0"
description = "Dependency-light deterministic evaluation harness for LLM workflow prototypes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-reliability = "agent_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
