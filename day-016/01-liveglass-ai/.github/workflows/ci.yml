name: LiveGlass CI
on:
  push:
    paths:
      - "day-016/01-liveglass-ai/**"
  pull_request:
    paths:
      - "day-016/01-liveglass-ai/**"
jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-016/01-liveglass-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: python -m py_compile scripts/local_translate.py scripts/install_language.py
